name: Build NovaStats APK

on:
  push:
    branches: ["**"]
    paths:
      - "NovaStats/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler, tester et publier l'APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NovaStats

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 (avec cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests unitaires (JVM)
        id: tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/unit-test.log"

      # Exécuter le build même si un test échoue, afin de distinguer une régression de test d'une erreur de compilation.
      - name: Compiler l'APK debug
        id: build-apk
        if: always()
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-apk.log
        env:
          # Facultatif : si ces secrets existent, ils remplacent api_keys.properties
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_ENGINE_ID: ${{ secrets.GOOGLE_ENGINE_ID }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          THEAUDIODB_API_KEY: ${{ secrets.THEAUDIODB_API_KEY }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Renommer l'APK
        id: apk
        if: always() && steps.build-apk.outcome == 'success'
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NAME="NovaStats-debug-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Artefact (téléchargeable depuis l'onglet Actions)
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NovaStats-debug-apk
          path: NovaStats/${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Rapport de tests (en cas d'échec)
        if: always() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            unit-test.log
            NovaStats/app/build/reports/
          retention-days: 7

      # Les logs bruts ne sont pas téléchargeables hors de GitHub : remonter les erreurs de compilation
      # et de test en annotations, lisibles via l'API check-runs.
      - name: Publier les erreurs en annotations
        if: always() && (steps.tests.outcome == 'failure' || steps.build-apk.outcome == 'failure')
        run: |
          {
            grep -hE "^e: |: error: |error: |FAILED|Execution failed for task|Tests? .* FAILED" \
              "$GITHUB_WORKSPACE/unit-test.log" build-apk.log 2>/dev/null || true
          } | sort -u | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Build::${line}"
          done

      # Publication dans "Releases" : lien direct téléchargeable depuis un téléphone, sans connexion GitHub.
      - name: Publier dans GitHub Releases
        if: always() && steps.apk.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "NovaStats build #${{ github.run_number }}"
          prerelease: true
          body: |
            📱 **APK de test NovaStats** — branche `${{ github.ref_name }}`, commit `${{ github.sha }}`

            **Installation sur Android**
            1. Télécharge le fichier `.apk` ci‑dessous depuis ton téléphone.
            2. Ouvre‑le → autorise « Installer des applications inconnues » pour ton navigateur si demandé.
            3. Une fois installée : Réglages → Service → Activer la détection, puis Réglages → Données → Importer un backup JSON.

            ⚠️ Build de développement (signature debug) : désinstalle l'ancienne version si Android refuse la mise à jour.
          files: NovaStats/${{ steps.apk.outputs.name }}
