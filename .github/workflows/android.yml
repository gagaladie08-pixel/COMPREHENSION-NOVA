name: Build NovaStats APK

on:
  push:
    branches: ["**"]
    paths:
      - "NovaStats/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler, tester et publier l'APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NovaStats

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 (avec cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests unitaires (JVM)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compiler l'APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        id: apk
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NAME="NovaStats-debug-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Artefact (téléchargeable depuis l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: NovaStats-debug-apk
          path: NovaStats/${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Rapport de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: NovaStats/app/build/reports/
          retention-days: 7

      # Publication dans "Releases" : lien direct téléchargeable depuis un téléphone, sans connexion GitHub.
      - name: Publier dans GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "NovaStats build #${{ github.run_number }}"
          prerelease: true
          body: |
            📱 **APK de test NovaStats** — branche `${{ github.ref_name }}`, commit `${{ github.sha }}`

            **Installation sur Android**
            1. Télécharge le fichier `.apk` ci‑dessous depuis ton téléphone.
            2. Ouvre‑le → autorise « Installer des applications inconnues » pour ton navigateur si demandé.
            3. Une fois installée : Réglages → Service → Activer la détection, puis Réglages → Données → Importer un backup JSON.

            ⚠️ Build de développement (signature debug) : désinstalle l'ancienne version si Android refuse la mise à jour.
          files: NovaStats/${{ steps.apk.outputs.name }}
