name: Diag tests

# Diagnostic temporaire : les journaux Actions ne sont pas lisibles depuis l'agent,
# on publie donc la sortie des tests directement dans le dépôt.
on:
  push:
    paths:
      - ".github/workflows/diag-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    name: Tests unitaires + rapport versionné
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NovaStats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests unitaires (sortie complète conservée)
        run: |
          gradle :app:testDebugUnitTest --no-daemon --continue --console=plain > /tmp/tests.log 2>&1 || true
          {
            echo "Rapport de tests — commit ${GITHUB_SHA}"
            echo "=================================================="
            echo "--- Classes en échec ---"
            grep -E "FAILED|> There were failing tests" /tmp/tests.log || echo "(aucun échec détecté dans la sortie Gradle)"
            echo
            echo "--- Extrait (200 dernières lignes utiles) ---"
            grep -vE "^\s*$" /tmp/tests.log | tail -n 200
          } > "$GITHUB_WORKSPACE/ci-test-report.txt"
          tail -n 40 "$GITHUB_WORKSPACE/ci-test-report.txt"

      - name: Publier le rapport
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add -f ci-test-report.txt
          if git diff --cached --quiet; then
            echo "Rapport inchangé"
          else
            git commit -m "ci: rapport de tests unitaires [skip ci]"
            git push
          fi
