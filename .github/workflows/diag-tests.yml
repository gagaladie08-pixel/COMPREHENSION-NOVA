name: Diag tests

# Diagnostic temporaire : les journaux Actions ne sont pas lisibles depuis l'agent,
# on publie donc le rapport de tests directement dans le dépôt.
on:
  push:
    paths:
      - ".github/workflows/diag-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    name: Tests unitaires + rapport versionné
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NovaStats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests unitaires
        run: gradle :app:testDebugUnitTest --no-daemon --continue || true

      - name: Extraire le rapport
        if: always()
        run: |
          set -o pipefail
          OUT="$GITHUB_WORKSPACE/ci-test-report.txt"
          {
            echo "Rapport de tests — $(date -u +%FT%TZ) — commit ${GITHUB_SHA}"
            echo "=================================================="
            echo "--- Résumés par classe ---"
            find app/build/test-results -name "TEST-*.xml" -print0 2>/dev/null \
              | xargs -0 -r grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' || true
            echo
            echo "--- Échecs (nom + message) ---"
            python3 - <<'PY'
import glob, xml.etree.ElementTree as ET
for f in sorted(glob.glob("app/build/test-results/**/TEST-*.xml", recursive=True)):
    try:
        root = ET.parse(f).getroot()
    except Exception as e:
        print(f"[illisible] {f}: {e}")
        continue
    for tc in root.iter("testcase"):
        for kind in ("failure", "error"):
            n = tc.find(kind)
            if n is not None:
                msg = (n.get("message") or "").strip().splitlines()[:6]
                print(f"### {tc.get('classname')}.{tc.get('name')}")
                for line in msg:
                    print("    " + line)
                text = (n.text or "").strip().splitlines()
                for line in text[:25]:
                    print("    | " + line)
                print()
PY
          } > "$OUT" 2>&1
          cat "$OUT"

      - name: Publier le rapport
        if: always()
        run: |
          cp "$GITHUB_WORKSPACE/ci-test-report.txt" "$GITHUB_WORKSPACE/ci-test-report.txt" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add -f ci-test-report.txt
          if git diff --cached --quiet; then
            echo "Rapport inchangé"
          else
            git commit -m "ci: rapport de tests unitaires [skip ci]"
            git push
          fi
