org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Le démon Kotlin séparé ne démarrait plus de façon fiable sur le runner GitHub Actions
# (« Could not connect to Kotlin compile daemon » -> :app:kspDebugKotlin FAILED) : deux JVM
# (Gradle + démon Kotlin) se disputaient la mémoire du runner. Compiler dans le process Gradle
# supprime la seconde JVM ; c'est aussi plus rapide quand Gradle tourne déjà en --no-daemon.
kotlin.compiler.execution.strategy=in-process
