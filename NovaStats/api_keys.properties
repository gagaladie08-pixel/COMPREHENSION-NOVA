# ============================================================================
# Clés API NovaStats — valeurs de secours lues par app/build.gradle.kts.
#
# Ordre de priorité : variable d'environnement (GitHub Secrets) > local.properties > ce fichier.
#
# ⚠️ Ces clés proviennent du document DEBUT (déjà public dans ce dépôt).
#    Pour les protéger : régénère-les chez chaque fournisseur, ajoute-les dans
#    GitHub → Settings → Secrets and variables → Actions (mêmes noms), puis vide ce fichier.
# ============================================================================
LASTFM_API_KEY=a37aa1249088a869dffe4875ccbeab99
FANART_API_KEY=33e017aac09660c6a2a228d8b85618d5
# Spotify / Google Images : sources RETIRÉES de la cascade (0.8.5) — Spotify exige un compte Premium
# depuis le 9 mars 2026, la Custom Search JSON API est fermée (arrêt le 01/01/2027). Laisser vide.
SPOTIFY_CLIENT_ID=
SPOTIFY_CLIENT_SECRET=
GOOGLE_API_KEY=
GOOGLE_ENGINE_ID=
# TheAudioDB : "123" = clé publique gratuite officielle (30 req/min, 1 résultat/recherche). Clé Patreon facultative.
THEAUDIODB_API_KEY=123
# Discogs : token personnel OBLIGATOIRE pour la recherche (sinon HTTP 401). Secret GitHub DISCOGS_TOKEN.
DISCOGS_TOKEN=
# Genius : « Client Access Token » gratuit (genius.com/api-clients). Secret GitHub GENIUS_ACCESS_TOKEN.
GENIUS_ACCESS_TOKEN=
# YouTube Data API v3 : clé Google Cloud gratuite (10 000 unités/jour). Dernier recours. Secret GitHub YOUTUBE_API_KEY.
YOUTUBE_API_KEY=
